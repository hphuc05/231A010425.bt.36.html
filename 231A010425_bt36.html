<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Hứng Táo - MSSV_BT36</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            text-align: center;
        }

        .student-info {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 1rem;
        }

        /* Khung game yêu cầu */
        #game-container {
            width: 500px;
            height: 400px;
            border-radius: 12px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 3px solid #ddd;
        }

        /* Panel thông tin Điểm và Mạng sống */
        .game-stats {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: #2c3e50;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Giỏ hứng (#basket) */
        #basket {
            width: 80px;
            height: 25px;
            background: #8B4513; /* Màu nâu */
            border-radius: 4px 4px 10px 10px;
            position: absolute;
            bottom: 10px;
            left: 210px; /* Vị trí mặc định giữa khung (500-80)/2 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.05s linear;
        }

        /* Quả táo (#apple) */
        #apple {
            width: 30px;
            height: 30px;
            background: #e74c3c; /* Màu đỏ */
            border-radius: 50%;
            position: absolute;
            top: 0px;
            left: 235px;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.15);
        }
        /* Cuống quả táo nhỏ */
        #apple::after {
            content: '';
            position: absolute;
            top: -5px;
            left: 12px;
            width: 4px;
            height: 8px;
            background: #27ae60;
            border-radius: 2px;
        }

        /* Màn hình thông báo / Bắt đầu / Game Over */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }

        #overlay h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #start-btn {
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        #start-btn:hover {
            background-color: #219653;
            transform: scale(1.05);
        }

        #start-btn:active {
            transform: scale(0.98);
        }

        .controls-hint {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Mini Game: Hứng Táo Rơi</h1>
    <div class="student-info">Mã sinh viên: <strong>231A010425_BT36</strong></div>

    <div id="game-container">
        <!-- Thanh trạng thái -->
        <div class="game-stats">
            <div>Điểm: <span id="score">0</span></div>
            <div>Mạng: <span id="lives">3</span></div>
        </div>

        <!-- Giỏ hứng -->
        <div id="basket"></div>

        <!-- Quả táo -->
        <div id="apple"></div>

        <!-- Màn hình chờ / Bắt đầu game -->
        <div id="overlay">
            <h2 id="overlay-title">Hứng Táo Thần Tốc</h2>
            <button id="start-btn">Bắt đầu</button>
        </div>
    </div>

    <div class="controls-hint">
        Sử dụng phím mũi tên <strong>Trái</strong> và <strong>Phải</strong> để di chuyển giỏ hứng.
    </div>

    <script>
        // Lấy các phần tử DOM
        const gameContainer = document.getElementById('game-container');
        const basket = document.getElementById('basket');
        const apple = document.getElementById('apple');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');

        // Kích thước khung & thành phần
        const containerWidth = 500;
        const containerHeight = 400;
        const basketWidth = 80;
        const basketHeight = 25;
        const appleSize = 30;

        // Trạng thái game
        let score = 0;
        let lives = 3;
        let isPlaying = false;

        // Tọa độ và tốc độ
        let basketX = (containerWidth - basketWidth) / 2;
        let appleX = Math.random() * (containerWidth - appleSize);
        let appleY = 40; // Bắt đầu ngay dưới thanh stat
        let appleSpeed = 2.5;

        // Trạng thái bàn phím
        let leftPressed = false;
        let rightPressed = false;

        // Lắng nghe sự kiện bàn phím
        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft') {
                leftPressed = true;
            } else if (e.key === 'ArrowRight') {
                rightPressed = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') {
                leftPressed = false;
            } else if (e.key === 'ArrowRight') {
                rightPressed = false;
            }
        });

        // Bắt đầu / Chơi lại game
        startBtn.addEventListener('click', () => {
            resetGame();
            overlay.style.display = 'none';
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        });

        function resetGame() {
            score = 0;
            lives = 3;
            appleSpeed = 2.5;
            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            
            basketX = (containerWidth - basketWidth) / 2;
            resetApple();
        }

        function resetApple() {
            appleX = Math.random() * (containerWidth - appleSize);
            appleY = 40; // Vị trí xuất phát bên dưới thanh header của game container
        }

        // Vòng lặp chính của game sử dụng requestAnimationFrame
        function gameLoop() {
            if (!isPlaying) return;

            // 1. Cập nhật vị trí giỏ hứng theo phím bấm (giới hạn trong khung 500px)
            const basketSpeed = 6;
            if (leftPressed) {
                basketX -= basketSpeed;
                if (basketX < 0) basketX = 0;
            }
            if (rightPressed) {
                basketX += basketSpeed;
                if (basketX > containerWidth - basketWidth) {
                    basketX = containerWidth - basketWidth;
                }
            }
            basket.style.left = basketX + 'px';

            // 2. Cập nhật vị trí rơi của quả táo
            appleY += appleSpeed;
            apple.style.top = appleY + 'px';
            apple.style.left = appleX + 'px';

            // 3. Kiểm tra va chạm với đáy khung (Táo rơi hụt)
            // Giả định đáy khung là chiều cao tổng container trừ đi thanh stat (khoảng 370px)
            const bottomLimit = containerHeight - basketHeight - 15;
            if (appleY >= bottomLimit) {
                // Kiểm tra xem vị trí ngang của táo có nằm trong khoảng giỏ hứng không
                const basketTopY = containerHeight - basketHeight - 10;
                
                // Điều kiện va chạm (Collision Detection)
                // Táo chạm tầm chiều cao giỏ và trục X nằm trong phạm vi giỏ
                if (appleY >= basketTopY - appleSize && 
                    appleX + appleSize >= basketX && 
                    appleX <= basketX + basketWidth) {
                    
                    // Hứng trúng táo!
                    score++;
                    scoreDisplay.textContent = score;
                    
                    // Tăng tốc độ rơi nhẹ nhàng theo yêu cầu
                    appleSpeed += 0.3;
                    resetApple();
                } else if (appleY >= containerHeight - appleSize) {
                    // Chạm đáy hoàn toàn mà không bắt được -> Mất mạng
                    lives--;livesDisplay.textContent = lives;

                    if (lives <= 0) {
                        endGame();
                        return;
                    } else {
                        resetApple();
                    }
                }
            }

            // Tiếp tục vòng lặp
            if (isPlaying) {
                requestAnimationFrame(gameLoop);
            }
        }

        function endGame() {
            isPlaying = false;
            overlayTitle.textContent = "Game Over - Bạn đã hết mạng!";
            startBtn.textContent = "Chơi lại";
            overlay.style.display = 'flex';
        }
    </script>
</body>
</html>
